services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5445:5432"
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    stdin_open: true
    tty: true
volumes:
  postgres_data: